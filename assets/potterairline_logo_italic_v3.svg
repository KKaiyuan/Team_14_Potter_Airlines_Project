<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Speed trail lines, skewed to match the P's lean, repositioned to stay inside the icon -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.85" transform="skewX(-12)">
    <line x1="48" y1="96" x2="96" y2="96" stroke-width="7"/>
    <line x1="38" y1="128" x2="102" y2="128" stroke-width="9"/>
    <line x1="48" y1="160" x2="96" y2="160" stroke-width="7"/>
  </g>

  <!-- Italic / slanted Letter P -->
  <g fill="#ffffff" transform="skewX(-12)">
    <!-- vertical stem -->
    <rect x="118" y="64" width="26" height="128" rx="6"/>
    <!-- bowl of the P -->
    <path d="
      M 118 64
      H 168
      C 196 64 214 80 214 104
      C 214 128 196 144 168 144
      H 118
      V 118
      H 166
      C 178 118 186 112 186 104
      C 186 96 178 90 166 90
      H 118
      Z"/>
  </g>
</svg>
